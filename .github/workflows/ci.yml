name: CI

on:
  pull_request:
  push:
    branches: [main]

# Self-hosted runners are a finite, shared resource. Cancel superseded runs
# on the same branch so a queue cannot build up behind force-pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # GitHub-hosted: free and unmetered on public repositories, and ephemeral.
    # Do NOT point this at a self-hosted runner while the repo is public —
    # GitHub's own guidance is to use self-hosted runners only with private
    # repos, because a fork can open a PR that runs arbitrary code on them.
    runs-on: ubuntu-latest
    # The visual gate builds Storybook and takes ~180 screenshots on top of the rest.
    timeout-minutes: 25


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Generated output is not stale
        run: node tools/check-stale.mjs packages/tokens/src/tokens.json packages/tokens/dist

      - name: The generated skill body is not stale
        run: node tools/design-system.mjs skill --check design/bitfire-design/SKILL.md

      - name: No raw colour outside generated files
        run: node tools/check-rawcolour.mjs packages fixtures consumers

      # The point of this job. A gate never proven to fail is indistinguishable
      # from no gate, and it fails in the direction that looks like success.
      - name: The gates still reject what they should
        run: bash tools/gate-tests.sh

      - name: Install the workspace
        run: npm ci || npm install

      # Same npm scripts as the local `npm run check`. The app consumer
      # imports the built dist/, so the build must come first.
      - name: Build @bitfire/ui
        run: npm run build:ui

      - name: The built package exports, loads under Node and ships the right CSS
        run: npm run check:build

      # Packs both packages and installs the tarballs into an empty directory
      # outside the repo: the workspace links packages, so this is the only
      # place a wrong files, exports or peer range would show. No registry.
      - name: A clean install from the packed tarballs works
        run: npm run check:install

      - name: The app consumer resolves and runs
        run: npm run check:app

      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The cache holds the browser but not its OS libraries, so --with-deps
      # runs every time; it is quick when they are already present.
      - name: Install Chromium for the accessibility gate
        run: npx playwright install --with-deps chromium

      # Same npm script as the local `npm run check`: all stories pass axe in
      # both themes, and each deliberately broken proof story must fail on the
      # axe rule it was written to trip.
      - name: Accessibility gate
        run: npm run check:a11y

      # Same npm script as the local `npm run check`. On Linux (this runner) it
      # compares every story, both themes, against the committed baselines and
      # proves a deliberate visual change is caught. It never writes a baseline:
      # a missing or different screenshot fails. Only the visual-baselines
      # workflow regenerates them. On Windows/macOS it is SKIPPED (the renderer
      # is pinned to Linux): the one declared exception to "no check only in CI".
      - name: Visual regression gate
        run: npm run check:visual

      # The actual, expected and diff images of any screenshot that did not match,
      # so a reviewer can look at them instead of reading a pixel count.
      - name: Upload the visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: packages/ui/test-results/visual
          if-no-files-found: ignore

      - name: Checks left the working tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a check modified the working tree"
            git status --porcelain
            exit 1
          fi
