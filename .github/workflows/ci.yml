name: CI

on:
  pull_request:
  push:
    branches: [main]

# Self-hosted runners are a finite, shared resource. Cancel superseded runs
# on the same branch so a queue cannot build up behind force-pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # GitHub-hosted: free and unmetered on public repositories, and ephemeral.
    # Do NOT point this at a self-hosted runner while the repo is public —
    # GitHub's own guidance is to use self-hosted runners only with private
    # repos, because a fork can open a PR that runs arbitrary code on them.
    runs-on: ubuntu-latest
    timeout-minutes: 10


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Generated output is not stale
        run: node tools/check-stale.mjs packages/tokens/src/tokens.json packages/tokens/dist

      - name: No raw colour outside generated files
        run: node tools/check-rawcolour.mjs packages fixtures consumers

      # The point of this job. A gate never proven to fail is indistinguishable
      # from no gate, and it fails in the direction that looks like success.
      - name: The gates still reject what they should
        run: bash tools/gate-tests.sh

      - name: Install the workspace
        run: npm ci || npm install

      - name: The app consumer resolves and runs
        run: node consumers/app/src/app.mjs

      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The cache holds the browser but not its OS libraries, so --with-deps
      # runs every time; it is quick when they are already present.
      - name: Install Chromium for the accessibility gate
        run: npx playwright install --with-deps chromium

      # Same npm script as the local `npm run check`: all stories pass axe in
      # both themes, and the deliberately broken proof story must fail on an
      # axe rule.
      - name: Accessibility gate
        run: npm run check:a11y

      - name: Checks left the working tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a check modified the working tree"
            git status --porcelain
            exit 1
          fi
